pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: '*.{ts,tsx,js,jsx}'
      run: pnpm exec oxlint {staged_files}
    - name: format
      glob: '*.{ts,tsx,js,jsx,json,css,html}'
      run: pnpm exec oxfmt {staged_files}
      stage_fixed: true

pre-push:
  jobs:
    - name: test
      run: pnpm test
