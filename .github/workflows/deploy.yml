name: Deploy (Cloudflare Workers)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Workers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build (Vite)
        run: pnpm build
      - name: Check Cloudflare credentials
        id: cf-check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID が未設定のためデプロイをスキップします。"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Ensure R2 bucket (idempotent)
        if: steps.cf-check.outputs.skip != 'true'
        run: pnpm exec wrangler r2 bucket create tektite-vaults || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Ensure KV namespace and resolve id (idempotent)
        if: steps.cf-check.outputs.skip != 'true'
        id: kv
        run: |
          ID=$(pnpm exec wrangler kv namespace list | jq -r '.[] | select(.title == "tektite-tokens") | .id' | head -n 1)
          if [ -z "$ID" ]; then
            ID=$(pnpm exec wrangler kv namespace create tektite-tokens | jq -r '.id')
          fi
          echo "id=$ID" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy (wrangler deploy)
        if: steps.cf-check.outputs.skip != 'true'
        run: pnpm deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TEKTITE_KV_NAMESPACE_ID: ${{ steps.kv.outputs.id }}
